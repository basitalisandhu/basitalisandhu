name: Update profile README

on:
  schedule:
    # 05:17 UTC daily. Off the hour to avoid the queue at :00.
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_readme.py
      - .github/workflows/update-profile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    name: Refresh latest releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Refresh releases block
        env:
          # Raises the API rate limit; the script also works without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme.py

      - name: Open and merge a pull request if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # main requires a pull request, so the refresh goes through one.
          if git diff --quiet -- README.md; then
            echo "README.md unchanged; nothing to commit."
            exit 0
          fi
          branch="automation/profile-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add README.md
          git commit -m "chore: refresh latest releases"
          git push --force origin "$branch"
          url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
          if [ -z "$url" ]; then
            url=$(gh pr create --base main --head "$branch" \
              --title "chore: refresh latest releases" \
              --body "Automated refresh of the latest-releases block.")
          fi
          gh pr merge "$url" --squash --delete-branch

name: Update profile README

on:
  schedule:
    # 05:17 UTC daily. Off the hour to avoid the queue at :00.
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_readme.py
      - .github/workflows/update-profile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    name: Refresh latest releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Refresh releases block
        env:
          # Raises the API rate limit; the script also works without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh latest releases"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 3))
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
